name: RockSolid
description: >-
  RockSolid (rocksolid.network) is a DeFi platform offering actively managed,
  institutional-grade liquid vaults. It lets institutions, protocols and projects
  launch tailored, white-label vault products that give their communities
  streamlined access to higher yields and DeFi strategies typically reserved for
  large investors, sourcing yield from protocols such as Uniswap, Aave, Morpho
  and Yearn. Vaults are built on the ERC-7540 Asynchronous Tokenized Vault
  standard (Lagoon Finance implementation) and are audited. RockSolid publishes a
  public, read-only REST Vaults API that exposes vault metadata, curators,
  rewards, latest performance (NAV, APR/APY, TVL), strategy allocation snapshots
  by period, and calculated APR/TVL — plus smart-contract integration docs for
  on-chain deposit/redeem. Added to the API Evangelist network as a portfolio
  company of Kindred Ventures.
