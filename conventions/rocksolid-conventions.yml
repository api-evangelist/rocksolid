  style: none
  detail: >-
    Collection endpoints (/vaults, /vaults/allocation-periods) return full
    arrays. allocation-periods wraps results in {periods[], total} but exposes no
    page/cursor params. Performance history is server-truncated (5 records on the
    list endpoint, 30 on the detail endpoint).
