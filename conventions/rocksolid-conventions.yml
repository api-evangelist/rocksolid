  detail: Client-side only, e.g. filter vaults by the is_active boolean field.
field_conventions:
  monetary: Wei-denominated values (tvlRaw, per_share_nav, *_raw) returned as strings to avoid precision loss.
  percentages: >-
    Allocation and strategy APR values in allocation snapshots are decimals
    (0.20 = 20%); top-level apr/*AprAgainstEth are percentage strings ("12.34").
  basis_points: Fees (aum_fee, performance_fee) and stored allocation/APR values are basis points (÷100 to decimal).
